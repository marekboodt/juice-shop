name: Reusable DAST Scan to other Repo option zap

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # Other jobs (SCA, SAST, build) go here...

  DAST-ZAP:
    uses: marekboodt/Security-Scanning-Repo/.github/workflows/test-20-dast-workflow.yml@main
    with:
      dast-scan-tool: zap
      project_dir: ./                       # not used by DAST if scanning a container
      environment: non-prod
      # start_command can be empty when scanning a service container
      start_command: ""
      # Target the service hostname 'app' (set inside the reusable workflow)
      website_target: "http://app:3000"
      # NEW inputs (see step 2 below):
      service_image: "bkimminich/juice-shop:latest"
      container_port: 3000
      health_path: "/"
      env_json: "{}"
      scan_type: "full"                 # "baseline" or "full"
      cmd_options: "-a -j -r report_html.html -x report_xml.xml" # baseline: add -a for some active probes
    secrets: inherit
